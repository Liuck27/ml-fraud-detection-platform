# =============================================================================
# ML Fraud Detection Platform — Docker Compose
#
# All six services are active: PostgreSQL, MLflow, Airflow (x3 containers),
# FastAPI serving, Prometheus, Grafana. Phase comments mark when each was added.
# =============================================================================

# Shared config block for all three Airflow containers (Phase 2).
x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  env_file: .env
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./data:/opt/airflow/data
    # Read-only: the retrain DAG runs training/train_xgboost.py via subprocess
    # and imports model_registry.py for the champion promotion gate.
    - ./training:/opt/airflow/training:ro
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - fraud-net

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: fraud_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fraud-net

  # ── MLflow ─────────────────────────────────────────────────────────────────
  # Phase 3: experiment tracking + model registry.
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: fraud_mlflow
    restart: unless-stopped
    env_file: .env
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_artifacts:/app/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy
    # Proxied artifacts: clients see mlflow-artifacts:/ URIs and upload/download
    # over HTTP through this server, which stores files in the volume. Never use
    # a local path for --default-artifact-root here — clients would interpret it
    # as a path on THEIR machine and write artifacts outside the stack.
    command: >
      mlflow server
      --backend-store-uri ${MLFLOW_BACKEND_STORE_URI}
      --serve-artifacts
      --artifacts-destination ${MLFLOW_ARTIFACT_ROOT}
      --default-artifact-root mlflow-artifacts:/
      --host 0.0.0.0
      --port 5000
    healthcheck:
      # The image has no curl; python ships with it. MLflow serves GET /health.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fraud-net

  # ── Airflow ─────────────────────────────────────────────────────────────────
  # Phase 2: Airflow init, webserver, and scheduler.

  airflow-init:
    <<: *airflow-common
    container_name: fraud_airflow_init
    command: ["bash", "-c", "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"]
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: fraud_airflow_webserver
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: fraud_airflow_scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── FastAPI Serving ──────────────────────────────────────────────────────────
  # Phase 4: real-time inference + A/B testing + SHAP.
  serving:
    build:
      context: ./serving
      dockerfile: Dockerfile
    container_name: fraud_serving
    restart: unless-stopped
    env_file: .env
    ports:
      - "${SERVING_PORT:-8000}:8000"
    volumes:
      - mlflow_artifacts:/app/mlartifacts  # shared with mlflow — required for local artifact loading
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy  # models are loaded at startup, so MLflow must be ready
    healthcheck:
      # GET /health always returns 200; the JSON status field says whether the
      # models actually loaded. A fresh stack with no trained models shows
      # "unhealthy" here — that is accurate, not a bug (train, then restart).
      test: ["CMD", "python", "-c", "import json,sys,urllib.request; r=json.load(urllib.request.urlopen('http://localhost:8000/health', timeout=3)); sys.exit(0 if r['status'] == 'healthy' else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - fraud-net

  # ── Prometheus ───────────────────────────────────────────────────────────────
  # Phase 5: Metrics collection — scrapes FastAPI /metrics endpoint.
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: fraud_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerting/rules.yml:/etc/prometheus/rules.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_DAYS:-15}d
    networks:
      - fraud-net

  # ── Grafana ──────────────────────────────────────────────────────────────────
  # Phase 5: Dashboards — auto-provisioned from monitoring/grafana/provisioning/.
  grafana:
    image: grafana/grafana:10.2.0
    container_name: fraud_grafana
    restart: unless-stopped
    env_file: .env
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - fraud-net

networks:
  fraud-net:
    name: fraud-detection-net
    driver: bridge

volumes:
  postgres_data:
    name: fraud_postgres_data
  mlflow_artifacts:
    name: fraud_mlflow_artifacts
